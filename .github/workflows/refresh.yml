name: Refresh dashboard

on:
  schedule:
    # 08:30 Asia/Shanghai = 00:30 UTC
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and build
        shell: pwsh
        run: |
          # Monday (1) syncs the free-model ranking; other days skip it.
          $dow = (Get-Date).DayOfWeek.value__
          $extra = if ($dow -eq 1) { "--sync-ranking" } else { "" }
          Write-Host "weekday=$dow extra=$extra"
          python run.py $extra

      # 摘要只是锦上添花，绝不能因为它失败就挡住部署。
      # 历史教训：曾把 python 代码内联在本步骤里，PowerShell here-string
      # 的终止符必须顶格，放进 YAML 缩进块里必然失效 → 整轮 workflow 变红。
      - name: Report summary
        continue-on-error: true
        shell: pwsh
        run: python scripts/report.py

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyber-egg-site
          path: site/
          retention-days: 14

      - uses: actions/configure-pages@v5
        with:
          # 首次运行时尝试自动开启 Pages（免去手动去 Settings 点一次）
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
