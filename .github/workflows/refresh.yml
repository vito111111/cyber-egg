name: Refresh dashboard

on:
  schedule:
    # 08:30 Asia/Shanghai = 00:30 UTC
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 采集与构建：这一环失败才是真失败 ──────────────────────────
  refresh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and build
        shell: pwsh
        run: |
          # 周一（1）额外同步免费模型榜；其他日子跳过，省时间。
          $dow = (Get-Date).DayOfWeek.value__
          $extra = if ($dow -eq 1) { "--sync-ranking" } else { "" }
          Write-Host "weekday=$dow extra=$extra"
          python run.py $extra

      # 摘要只是锦上添花，不能因为它失败就挡住产物上传。
      # 教训：曾把 python 代码内联在本步骤里，PowerShell here-string 的
      # 终止符 "@ 必须顶格，放进 YAML 缩进块必然失效 → 整轮变红。
      - name: Report summary
        continue-on-error: true
        shell: pwsh
        run: python scripts/report.py

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyber-egg-site
          path: site/
          retention-days: 14

  # ── 发布到 Pages：仓库未启用 Pages 时跳过，不算失败 ──────────
  pages:
    needs: refresh
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: cyber-egg-site
          path: site

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
