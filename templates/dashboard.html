n=%22round%22%20stroke-linecap=%22round%22%20opacity=%22.9%22/%3E%20%3C/svg%3E">
<style>
:root{
  --bg:#f7f8fa; --card:#fff; --ink:#12161d; --ink2:#49505e; --ink3:#8a93a3;
  --line:#e5e8ef; --line2:#eff1f6;
  --teal:#0d8b7f; --teal-d:#0a6a61; --teal-bg:#e7f5f3;
  --coral:#d4573f; --coral-bg:#fdefec;
  --amber:#c0700c; --amber-bg:#fdf4e4;
  --red:#c0392b; --red-bg:#fdecea;
  --blue:#2b62d9; --blue-bg:#ecf1fd;
  --violet:#7048c8; --violet-bg:#f2eefc;
  --green:#0a8f5c; --green-bg:#e8f7f0;
  --gray:#6c7583; --gray-bg:#eff1f5;
  --A:#0a8f5c; --A-bg:#e8f7f0;
  --B:#2b62d9; --B-bg:#ecf1fd;
  --C:#c0700c; --C-bg:#fdf4e4;
  --D:#6c7583; --D-bg:#eff1f5;
  --sh:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.05);
  --sh-md:0 4px 14px rgba(16,24,40,.08);
  --sh-lg:0 14px 34px rgba(16,24,40,.14);
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);line-height:1.6;font-size:14px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding-bottom:64px;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* ══════════ 顶栏 ══════════ */
header{background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:60}
.hd{max-width:1520px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:22px;height:58px}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
.egg{width:31px;height:31px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(13,139,127,.28);transition:transform .32s cubic-bezier(.32,.72,0,1);
  border-radius:9px;overflow:hidden;flex-shrink:0}
.egg svg{width:100%;height:100%;display:block}
.brand:hover .egg{transform:rotate(-6deg) scale(1.07)}
.brand h1{font-size:14.5px;font-weight:750;letter-spacing:-.015em;line-height:1.2}
.brand span{display:block;font-size:10px;color:var(--ink3);font-weight:500;letter-spacing:.02em}
.screens{display:flex;gap:2px;background:#eef0f5;padding:3px;border-radius:10px}
.screen-btn{border:none;background:none;font-family:inherit;font-size:12.5px;font-weight:650;
  color:var(--ink3);padding:6px 15px;border-radius:8px;cursor:pointer;transition:.18s;
  display:flex;align-items:center;gap:6px;white-space:nowrap}
.screen-btn:hover{color:var(--ink2)}
.screen-btn.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.1)}
.screen-btn .n{font-size:10px;background:var(--teal-bg);color:var(--teal-d);padding:0 5px;border-radius:7px;font-weight:700;line-height:1.6}
.screen-btn.on .n{background:var(--teal);color:#fff}
.screen-btn .n.alert{background:var(--red-bg);color:var(--red)}
.hd-r{margin-left:auto;display:flex;align-items:center;gap:13px;font-size:11.5px;color:var(--ink3)}
.src-dots{display:flex;gap:7px;align-items:center}
/* 数据源状态点：必须 inline-block，否则行内元素上 width/height 不生效，
   只会剩下一道 box-shadow 痕迹（曾因此渲染成细碎小横线）。 */
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;flex-shrink:0;
  background:var(--green);box-shadow:0 0 0 2.5px var(--green-bg)}
.dot.off{background:#c3cad4;box-shadow:0 0 0 2.5px #f1f3f6}
.dot.warn{background:var(--amber);box-shadow:0 0 0 2.5px var(--amber-bg)}
.btn-b{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 11px;
  font-size:11.5px;color:var(--ink2);cursor:pointer;font-family:inherit;transition:.15s;font-weight:550}
.btn-b:hover{background:#f8f9fb;border-color:#d3d8e0;transform:translateY(-1px)}

.wrap{max-width:1520px;margin:0 auto;padding:0 24px}

/* ══════════ 过滤条 ══════════ */
.fbar{margin:20px 0 6px;background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px}
.frow{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.flabel{font-size:10.5px;font-weight:750;color:var(--ink3);letter-spacing:.04em;
  text-transform:uppercase;padding-right:3px;flex-shrink:0;white-space:nowrap}
.fdiv{width:1px;height:18px;background:var(--line);margin:0 4px;flex-shrink:0}
.fchip{border:1px solid transparent;background:#f6f8fa;border-radius:8px;padding:6px 13px;
  font-size:12.5px;font-family:inherit;color:var(--ink2);cursor:pointer;transition:.16s;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1.4}
.fchip:hover{background:#eef1f5;transform:translateY(-1px)}
.fchip.on{background:var(--ink);color:#fff;box-shadow:0 2px 8px rgba(18,22,29,.2)}
.fchip .c{font-size:10px;opacity:.6;font-weight:700;min-width:14px;text-align:center}
.fchip.on .c{opacity:.75}
/* 第一梯队 chip 用金色，视觉上比形态筛选更高一级 */
.fchip.t1{border-color:#f0dbb8;background:#fffaf0;color:#8a5a0a}
.fchip.t1:hover{background:#fdf4e4}
.fchip.t1.on{background:linear-gradient(135deg,#c9962e,#a87a18);border-color:#a87a18;color:#fff;
  box-shadow:0 2px 10px rgba(168,122,24,.35)}
.fchip.t1.on .c{opacity:.85}
/* 多模态 chip 用紫色 */
.fchip.mm{border-color:#ddd4f5;background:#faf8ff;color:#5a37a6}
.fchip.mm:hover{background:#f2eefc}
.fchip.mm.on{background:linear-gradient(135deg,#7c53d8,#5a37a6);border-color:#5a37a6;color:#fff;
  box-shadow:0 2px 10px rgba(90,55,166,.32)}
.fsp{flex:1}
.tgl{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);cursor:pointer;
  user-select:none;padding:5px 9px;border-radius:7px;transition:.15s;white-space:nowrap}
.tgl:hover{background:#f6f8fa}
.tgl input{accent-color:var(--teal);width:13px;height:13px;cursor:pointer;flex-shrink:0}

/* ══════════ 区块 ══════════ */
.sect{margin:26px 0 0}
.sect-hd{display:flex;align-items:center;gap:9px;margin-bottom:13px}
.sect-ico{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0}
.sect-ico svg{width:14px;height:14px}
.sect-hd h2{font-size:15px;font-weight:750;letter-spacing:-.01em}
.sect-hd .desc{font-size:11.5px;color:var(--ink3);margin-left:1px}
.sect-hd .cnt{margin-left:auto;font-size:11.5px;color:var(--ink3);font-weight:600;
  background:#f1f3f7;padding:2px 9px;border-radius:20px}

/* ══════════ 统一福利卡 ══════════ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}

.ec{--accent:var(--teal);--accent-bg:var(--teal-bg);--accent-d:var(--teal-d);
  background:#fff;border:1px solid var(--line);border-radius:var(--r);
  display:flex;flex-direction:column;overflow:hidden;position:relative;
  box-shadow:var(--sh);transition:transform .22s cubic-bezier(.32,.72,0,1),box-shadow .22s,border-color .22s;
  animation:rise .38s cubic-bezier(.32,.72,0,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ec:hover{transform:translateY(-3px);box-shadow:var(--sh-lg);border-color:#d6dbe4}
.ec:hover .ec-cta{background:var(--accent-d);border-color:var(--accent-d)}

/* 左侧强调条 */
.ec::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.9}

/* 类型色：flash / reset / daily / signup / deal */
.ec.k-flash{--accent:#d4573f;--accent-bg:#fdefec;--accent-d:#b8442e}
.ec.k-reset{--accent:#2b62d9;--accent-bg:#ecf1fd;--accent-d:#1e4cb0}
.ec.k-daily{--accent:#0d8b7f;--accent-bg:#e7f5f3;--accent-d:#0a6a61}
.ec.k-signup{--accent:#7048c8;--accent-bg:#f2eefc;--accent-d:#5a37a6}
.ec.k-deal{--accent:#2b7fd9;--accent-bg:#eaf3fd;--accent-d:#1e63b0}
.ec.dead{opacity:.5;filter:saturate(.28)}
.ec.dead::before{background:var(--gray)}

/* --- 头 --- */
.ec-hd{padding:13px 16px 0 18px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ec-kind{font-size:10px;font-weight:750;padding:2.5px 8px 2.5px 6px;border-radius:6px;letter-spacing:.03em;
  background:var(--accent-bg);color:var(--accent-d);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.ec-kind .ki{display:inline-flex;width:11px;height:11px;flex-shrink:0}
.ec-kind .ki svg{width:11px;height:11px}
/* 第一梯队星标 */
.ec-t1{font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:5px;letter-spacing:.02em;
  background:linear-gradient(135deg,#fdf0d5,#fae4b8);color:#8a5a0a;white-space:nowrap;
  display:inline-flex;align-items:center;gap:2px;flex-shrink:0}
/* 模态标记：仅非纯文本显示 */
.ec-mod{font-size:9.5px;font-weight:750;padding:2px 6px;border-radius:5px;white-space:nowrap;flex-shrink:0}
.ec-reg{font-size:9.5px;font-weight:750;padding:2px 6px;border-radius:5px;letter-spacing:.02em}
.ec-reg.cn{background:#fdeeee;color:#ad3a3a}
.ec-reg.global{background:#eef2f7;color:#5a6573}
.ec-cd{margin-left:auto;font-size:11.5px;font-weight:750;padding:3px 9px;border-radius:20px;
  white-space:nowrap;letter-spacing:.01em;display:inline-flex;align-items:center;gap:4px}
.cd-critical{background:var(--red);color:#fff;animation:pulse 1.8s ease-in-out infinite}
.cd-warn{background:var(--amber-bg);color:var(--amber);border:1px solid #f0dbb8}
.cd-normal{background:var(--blue-bg);color:var(--blue)}
.cd-calm{background:var(--teal-bg);color:var(--teal-d)}
.cd-expired{background:var(--gray-bg);color:var(--gray)}
.cd-none{background:#f4f6f9;color:var(--ink3)}
.cd-upcoming{background:var(--violet-bg);color:var(--violet)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.97)}}

/* --- 额度 --- */
.ec-amt{padding:11px 16px 0 18px;display:flex;align-items:flex-end;gap:7px;height:56px;flex-shrink:0}
.ec-amt.empty-slot{height:40px}
.ec-num{font-size:32px;font-weight:820;letter-spacing:-.038em;line-height:.95;
  background:linear-gradient(135deg,var(--accent),var(--accent-d));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ec.dead .ec-num{background:none;-webkit-text-fill-color:var(--ink3);color:var(--ink3)}
.ec-unit{font-size:11px;color:var(--ink3);font-weight:650;padding-bottom:4px;letter-spacing:.01em}
.ec-num.tiny{font-size:21px;letter-spacing:-.02em}

/* --- 标题 --- */
.ec-body{padding:9px 16px 0 18px;flex:1;display:flex;flex-direction:column}
.ec-title{font-size:13.8px;font-weight:700;line-height:1.45;letter-spacing:-.005em;margin-bottom:5px}
.ec-meta{font-size:11px;color:var(--ink3);font-weight:600;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.ec-meta .sep{opacity:.4}
.ec-desc{font-size:12.2px;color:var(--ink2);line-height:1.6;margin-top:9px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:59px}

/* --- 操作区 --- */
.ec-ft{margin-top:12px;padding:11px 16px 13px 18px;border-top:1px solid var(--line2);
  display:flex;align-items:center;gap:8px}
.ec-grade{font-size:9.5px;font-weight:750;padding:2px 6px;border-radius:4px;letter-spacing:.02em}
.g-official{background:var(--green-bg);color:var(--green)}
.g-aggregator{background:var(--amber-bg);color:var(--amber)}
.g-manual{background:var(--blue-bg);color:var(--blue)}
.ec-sp{flex:1}

/* 主按钮：领 —— 大图标、大点击区 */
.ec-cta{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:38px;padding:0 18px;border-radius:10px;
  background:var(--accent);border:1px solid var(--accent);color:#fff;
  font-size:13.5px;font-weight:800;letter-spacing:.06em;text-decoration:none;
  cursor:pointer;transition:transform .16s,background .16s,box-shadow .16s;
  box-shadow:0 1px 3px rgba(0,0,0,.12);flex-shrink:0}
.ec-cta svg{width:16px;height:16px;stroke-width:2.6;flex-shrink:0}
.ec-cta:hover{transform:translateY(-1px) scale(1.02);box-shadow:0 4px 12px rgba(0,0,0,.16)}
.ec-cta:active{transform:scale(.97)}
.ec-more{min-height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);
  background:#fbfcfd;color:var(--ink2);font-size:12px;font-weight:650;cursor:pointer;
  font-family:inherit;transition:.15s;display:inline-flex;align-items:center;gap:4px;flex-shrink:0}
.ec-more:hover{background:#f1f3f6;color:var(--ink);border-color:#cdd4dd}

/* ══════════ 重置追踪 ══════════ */
.rc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:17px 19px;
  box-shadow:var(--sh);position:relative;overflow:hidden;animation:rise .38s cubic-bezier(.32,.72,0,1) both}
.rc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue)}
.rc-hd{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:13px}
.rc-av{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#1a1f2b,#333c4e);
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0;
  letter-spacing:-.02em}
.rc-name{font-size:14.5px;font-weight:750;line-height:1.3;letter-spacing:-.01em}
.rc-sub{font-size:11.5px;color:var(--ink3);margin-top:2px}
.rc-sub a{color:var(--teal-d);text-decoration:none;font-weight:650}
.rc-sub a:hover{text-decoration:underline}
.rc-stats{margin-left:auto;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.rc-st{text-align:center;min-width:52px}
.rc-st .v{font-size:18px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.rc-st .k{font-size:9.5px;color:var(--ink3);font-weight:600;margin-top:1px;white-space:nowrap}
.rc-st .v.red{color:var(--red)}
.rc-st .v.blue{color:var(--blue)}
.rc-rule{font-size:12.2px;color:var(--ink2);background:#f8fafb;border-radius:9px;
  padding:9px 12px;margin-bottom:14px;line-height:1.6;border-left:2px solid var(--blue)}
.tl{position:relative;padding:20px 0 4px;overflow-x:auto}
.tl::-webkit-scrollbar{height:5px}
.tl::-webkit-scrollbar-thumb{background:#dde2e9;border-radius:3px}
.tl-track{display:flex;align-items:flex-start;min-width:620px;position:relative;padding:0 3px}
.tl-line{position:absolute;left:0;right:0;top:9px;height:2px;background:#eef0f5;z-index:0}
.tl-done{position:absolute;left:0;top:9px;height:2px;background:linear-gradient(90deg,var(--blue),#5b8ae8);z-index:1;
  transition:width .8s cubic-bezier(.32,.72,0,1)}
.tl-n{flex:1;position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:42px}
.tl-d{width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid #e2e6ed;margin-top:4px;transition:.2s}
.tl-n.n-reset .tl-d{background:var(--red);border-color:var(--red);box-shadow:0 0 0 3px var(--red-bg)}
.tl-n.n-banked .tl-d{background:var(--amber);border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-bg)}
.tl-n.n-improve .tl-d{background:var(--green);border-color:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
.tl-n.n-past .tl-d{background:#aab3c0;border-color:#aab3c0;width:7px;height:7px;margin-top:5.5px}
.tl-n.n-future .tl-d{border-style:dashed;border-color:#d5dae2}
.tl-l{font-size:9px;color:var(--ink3);margin-top:5px;font-weight:650;white-space:nowrap}
.tl-n.n-reset .tl-l{color:var(--red);font-weight:750}
.tl-n.n-banked .tl-l{color:var(--amber)}
.tl-n.n-improve .tl-l{color:var(--green)}
.tl-n.n-past .tl-l{color:#aab3c0}
.tl-n.n-future .tl-l{color:#ccd2da}

footer{max-width:1520px;margin:30px auto 0;padding:15px 24px 0;border-top:1px solid var(--line);

<script>
const D = {{DATA_JSON}};
const FEED = D.feed, LIB = D.library, META = D.meta;

const QL={A:"可长期白嫖",B:"可用但有门槛",C:"一次性/需充值",D:"未核实/不可外带"};
const RL={cn:"国内",global:"海外"};
const KL={llm_api:"大模型平台",cloud_platform:"云厂商",coding_tool:"编程工具",specialized_api:"专用 API"};
const FL={perpetual:"永久免费","renewing-quota":"周期刷新","one-time":"一次性赠送","trial-credit":"试用额度","recurring-credit":"循环积分",unknown:"未标注"};
const KINDS=FEED.card_kinds, GRADES=FEED.source_grades;
const MODALITIES=FEED.modalities||{};

/* 类别图标（内联 SVG，避免 emoji 在不同系统下渲染成方块） */
const ICONS={

function tick(){
  document.querySelectorAll("[data-end]").forEach(node=>{
    const end=new Date(node.dataset.end).getTime(), now=Date.now(), diff=end-now;
    let txt,cls;
    if(diff<0){
      const h=Math.abs(diff)/3600000;
      txt=h<1?"已结束":"已结束 "+(h<24?Math.ceil(h)+"h":Math.ceil(h/24)+"d");
      cls="cd-expired";
    }else{
      const h=diff/3600000;
      if(diff<3600000) txt="剩 "+Math.ceil(diff/60000)+" 分";
      else if(h<24) txt="剩 "+Math.floor(h)+"h "+Math.floor((diff%3600000)/60000)+"m";
      else txt="剩 "+Math.floor(h/24)+"d "+Math.floor(h%24)+"h";
      cls=h<6?"cd-critical":h<48?"cd-warn":h<168?"cd-normal":"cd-calm";
    }
    node.textContent=txt; node.className="ec-cd "+cls;
  });
}

/* ── 重置追踪卡 ── */
function trackerHTML(t){
  const hist=t.history||[];
  const total=t._days_total||28, elapsed=t._days_elapsed||0;
  const pct=Math.max(0,Math.min(100,elapsed/Math.max(total,1)*100));
  let nodes="";
  for(let d=1;d<=Math.min(total,28);d++){
    const h=hist.find(x=>x.day===`Day ${d}`);
    let cls="n-future",desc="";
    if(h){
      const ty=h.type;
      cls=ty==="reset"?"n-reset":ty==="banked_reset"?"n-banked":ty==="improvement"?"n-improve":"";
      desc=ty==="reset"?"重置":ty==="banked_reset"?"储存":ty==="improvement"?"改进":"";
    }else if(d<=elapsed){ cls="n-past"; }
    nodes+=`<div class="tl-n ${cls}"><div class="tl-d"></div>
      <div class="tl-l">D${d}</div>${desc?`<div class="tl-x">${desc}</div>`:""}</div>`;
  }
  const lastR=t._last_reset;
  return `<div class="rc">
    <div class="rc-hd">
      <div class="rc-av">${esc((t.vendor_name||"O").slice(0,1))}</div>
      <div>
        <div class="rc-name">${esc(t.vendor_name)} · ${esc(t.campaign)}</div>
        <div class="rc-sub">追踪 <a href="${esc(t.profile_url)}" target="_blank" rel="noopener">@${esc(t.watcher_handle)}</a>（${esc(t.watcher_role)}）</div>
      </div>
      <div class="rc-stats">
        <div class="rc-st"><div class="v blue">${elapsed}/${total}</div><div class="k">挑战进度</div></div>
        <div class="rc-st"><div class="v red">${t._reset_count+t._banked_count}</div><div class="k">已重置</div></div>
        <div class="rc-st"><div class="v">${t._days_left??"—"}</div><div class="k">天后结束</div></div>
      </div>
    </div>
    <div class="rc-rule">${esc(t.campaign_rule)}</div>
    <div class="tl"><div class="tl-track">
      <div class="tl-line"></div><div class="tl-done" style="width:${pct}%"></div>${nodes}</div></div>
    <div class="tl-lg">
      <span><i style="background:#c0392b"></i>全面重置</span>
      <span><i style="background:#c0700c"></i>储存重置权</span>
      <span><i style="background:#0a8f5c"></i>发布改进</span>
      <span><i style="background:#aab3c0"></i>已过去无事件</span>
      <span><i style="background:#fff;border:1px dashed #d5dae2"></i>尚未到达</span>
    </div>
    <div class="rc-next"><span class="ic">⚠️</span><div>
      <b>下一次重置：官方未公告。</b>${esc(t.next_reset_note||"")}
      ${lastR?`<br>最近一次：<b>${esc(lastR.day)}（${esc(lastR.date)}）</b> — ${esc(lastR.note)}`:""}
      <br><b style="color:var(--red)">不做时间预测。</b>${esc(t.observed_pattern||"")}
    </div></div>
    <div class="rc-note">${esc(t.caveat||"")}</div>
  </div>`;
}

function renderFeed(){
  const cards=visibleCards();
  const all=S.ck==="all";
  // 重置追踪是「额度回收」，既不属于图像视频，也不是国内头部之外的细分，
  // 一旦用户按圈层或模态筛选，就应该让位，否则会一直占着首屏。
  const trackerOK = S.tier==="all" && S.mod==="all";
  let html="";

  if((all||S.ck==="reset")&&FEED.trackers.length&&trackerOK){
    html+=sect("reset",KCOLOR.reset,"额度重置追踪",KINDS.reset.hint,FEED.trackers.length+" 个",
      FEED.trackers.map(trackerHTML).join(""));
  }
  // 其余四类共用同一张卡片与同一个网格
  ["flash","daily","signup","deal"].forEach(k=>{
    if(!(all||S.ck===k)) return;
    const list=cards.filter(c=>c.card===k);
    if(!list.length) return;
    const cfg=KCOLOR[k];
    html+=sect(k,cfg,KINDS[k].label,KINDS[k].hint,list.length+" 条",
      `<div class="grid">${list.map((c,i)=>eggCard(c,i)).join("")}</div>`);
  });

  if(!html.trim()){
    // 按模态筛选时，重置追踪被隐藏，要给出可解释的空态而不是干巴巴「没有福利」
    const hint = (S.mod!=="all"||S.tier!=="all")
      ? `当前筛选下没有匹配的福利${S.mod!=="all"?"（模态筛选已隐藏额度重置追踪）":""}`
      : "当前筛选下没有福利";
    html=`<div class="panel"><div class="empty"><b>${esc(hint)}</b><br>试试切回「全部」，或关闭「隐藏已过期」</div></div>`;
  }
  el("feedBody").innerHTML=html;
  el("feedBody").querySelectorAll("[data-id]").forEach(n=>{
    n.onclick=e=>{ if(e.target.closest("a,button")) return; openCard(n.dataset.id); };
  });
  el("feedBody").querySelectorAll("[data-info]").forEach(b=>{
    b.onclick=e=>{e.stopPropagation();openCard(b.dataset.info)};
  });
  tick();
}

    <td class="date">${esc(r.reviewed||"—")}</td>
    <td>${r.present?`<span class="tag safe">已收录</span>`
      :`<a class="ec-more" style="min-height:auto;padding:2px 8px;font-size:10.5px" href="${esc(r.pricing||r.site)}" target="_blank" rel="noopener">官网</a>`}</td>
  </tr>`).join("");
  const orph=a.orphans.map(p=>`<span class="tag${p.pinned?" pin":""}" title="${esc(p.name)}">${esc(p.id)}</span>`).join("");
  el("libCoverage").innerHTML=`
    <div class="panel" style="margin-bottom:13px">
      <div class="panel-hd"><h3>前沿厂商覆盖</h3>
        <span class="sub">关注清单 ${st.total_watched} 家 · 已收录 ${st.present} 家</span>
        <span class="sp"></span>
        ${st.s_missing>0?`<span class="tag warn">S 级缺 ${st.s_missing} 家</span>`:`<span class="tag safe">S 级全覆盖</span>`}
      </div>
      <div class="cov">
        <div class="cov-nums"><span>覆盖率</span><span>${st.coverage_pct}%</span></div>
        <div class="cov-bar"><div class="cov-fill" style="width:${st.coverage_pct}%"></div>
          <div class="cov-miss" style="width:${100-st.coverage_pct}%"></div></div>
        <div class="cov-nums"><span style="font-weight:500">${st.present} 已收录</span>
          <span style="color:var(--red)">${st.missing} 待补</span></div>
      </div>
      ${a.missing.length?`<div style="padding:0 16px 8px;font-size:11.5px;font-weight:700;color:var(--red)">待补清单</div>
        <div class="miss-grid">${missingCards}</div>`
        :`<div style="padding:0 16px 16px;font-size:12px;color:var(--green)">✓ 关注清单已全部覆盖</div>`}
    </div>
    <div class="panel" style="margin-bottom:13px">
      <div class="panel-hd"><h3>关注清单明细</h3><span class="sub">tier S 必须收录，缺失即标红</span></div>
      <div style="overflow-x:auto"><table class="wl-table">
        <thead><tr><th>层级</th><th>厂商</th><th>地区</th><th>分级</th><th>免费额度摘要</th><th>核验</th><th>状态</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
    </div>
    <div class="panel"><div class="panel-hd"><h3>库内长尾</h3>
      <span class="sub">已收录但未进关注清单，共 ${a.orphans.length} 家</span></div>
      <div style="padding:12px 16px;line-height:2.1">${orph||'<span style="color:var(--ink3)">无</span>'}</div></div>`;
}

function renderLibRanking(){
  const r=LIB.ranking;
  if(!r.available){
    el("libRanking").innerHTML=`<div class="panel"><div class="empty">排名数据不可用：${esc(r.reason||"")}</div></div>`;
    return;
  }
  const stale=r.staleness||{};
  const rows=r.by_vendor.slice(0,20).map(v=>`<div class="rank-row ${v.rank<=3?"top":""}">
    <span class="rank-n">${v.rank}</span>
    <span class="rank-v">${esc(v.provider)}</span>
    <span class="rank-m">${esc(v.best_model||"—")}</span>
    <span style="font-size:10.5px;color:var(--ink3)">${v.models} 个免费模型</span>
    <span class="rank-s">${v.best_score.toFixed(1)}</span></div>`).join("");
  const sug=r.suggestions.map(s=>`<div class="miss-card" style="border-color:#f0dbb8;background:var(--amber-bg)">
    <div class="t" style="color:#6b4510"><span class="tier" style="background:var(--amber)">#${s.rank}</span>${esc(s.provider)}</div>
    <div class="w" style="color:#7a5a22">${esc(s.reason)}<br>最佳模型：${esc(s.best_model||"—")}（${s.score.toFixed(1)} 分）</div>
  </div>`).join("");
  el("libRanking").innerHTML=`
    <div class="panel" style="margin-bottom:13px">
      <div class="panel-hd"><h3>免费模型榜 · 厂商排名</h3>
        <span class="sub">上游更新 ${esc((r.updated_at||"").slice(0,10))}（${esc(stale.text||"—")}）</span>
        <span class="sp"></span>
        ${stale.stale?`<span class="tag warn">建议同步</span>`:`<span class="tag safe">数据新鲜</span>`}</div>
      <div style="padding:10px 16px;font-size:11.5px;color:var(--ink3);border-bottom:1px solid var(--line2);line-height:1.6">
        分数为上游对免费模型的综合评分（<code class="mono">zo_score</code>），此处只按厂商取最高分聚合，不自行造分。
        每周一同步，用于发现「进了榜但清单里没有」的新厂商。</div>
      ${rows}</div>
    <div class="panel">
      <div class="panel-hd"><h3>补全建议</h3><span class="sub">榜上有名但关注清单与库中都没有</span>
        <span class="sp"></span><span class="tag ${r.suggestions.length?"warn":"safe"}">${r.suggestions.length} 条</span></div>
      ${r.suggestions.length?`<div class="miss-grid" style="padding:13px">${sug}</div>`
        :`<div style="padding:15px 16px;font-size:12px;color:var(--green)">✓ 榜单前 25 名均已收录或已在关注清单</div>`}
      <div style="padding:0 16px 14px;font-size:11px;color:var(--ink3);line-height:1.6">
        同步命令：<code class="mono" style="background:#f4f6f9;padding:1px 5px;border-radius:4px">python run.py --sync-ranking</code></div></div>`;
}

let pvSort="rank", pvQ="";
function renderLibProviders(){
  el("lcPv").textContent=D.providers.length;
  const qo={A:0,B:1,C:2,D:3};
  let rows=D.providers.slice();
  if(pvQ){
    const q=pvQ.toLowerCase();
    rows=rows.filter(p=>[p.id,p.name,p.name_en,p.free_quota,(p.free_models||[]).join(" ")]
      .join(" ").toLowerCase().includes(q));
  }
  rows.sort((a,b)=>{
    // 人工补充的 S 级厂商（负 rank / pinned）永远排前面
    if(!!a.pinned!==!!b.pinned) return a.pinned?-1:1;
    if(pvSort==="quality") return qo[a.quality]-qo[b.quality]||(a.name||"").localeCompare(b.name||"","zh");
    if(pvSort==="name") return (a.name||"").localeCompare(b.name||"","zh");
    if(pvSort==="reviewed") return (b.reviewed||"").localeCompare(a.reviewed||"");
    return (a.rank??9999)-(b.rank??9999)||qo[a.quality]-qo[b.quality];
  });
  const body=rows.map(p=>{
    const chips=[];
    if(p.card_required===0) chips.push('<span class="tag safe">免绑卡</span>');
    else if(p.card_required===1) chips.push('<span class="tag warn">需绑卡</span>');
    if(p.phone_required===1) chips.push('<span class="tag warn">需实名</span>');
    if(!chips.length) chips.push('<span class="tag mute">未标注</span>');
    return `<tr data-pv="${esc(p.id)}">
      <td><span class="qb q${esc(p.quality)}" title="${esc(QL[p.quality])}">${esc(p.quality)}</span></td>
      <td><div class="pv-name"><span class="rg ${p.region}">${RL[p.region]||p.region}</span>
        <span class="nm" title="${esc(p.name)}">${esc(p.name)}</span>
        ${p.pinned?'<span class="tag pin" style="font-size:8.5px;padding:0 4px;flex-shrink:0">S</span>':""}</div>
        <div class="pv-id" title="${esc(p.id)}">${esc(p.id)}</div></td>
      <td><span class="tag mute" style="white-space:nowrap">${KL[p.kind]||p.kind}</span></td>
      <td><div class="qtext">${esc(p.free_quota||"—")}</div></td>
      <td><span class="date">${esc(cut(p.validity||"—",18))}</span></td>
      <td style="white-space:nowrap">${chips.join("")}</td>
      <td class="date">${esc(p.reviewed||"—")}</td></tr>`;
  }).join("");
  el("libProviders").innerHTML=`<div class="panel">
    <div class="panel-hd"><h3>全部厂商</h3><span class="sub">${rows.length} / ${D.providers.length} 家</span>
      <span class="sp"></span>
      <div class="searchbox">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/></svg>
        <input id="pvQ" type="search" placeholder="搜索厂商 / 模型 / 额度…" value="${esc(pvQ)}">
      </div>
      <select id="pvSortSel" style="border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:11.5px;font-family:inherit;color:var(--ink2);background:#fbfcfd">
        <option value="rank">默认排序</option><option value="quality">分级 A→D</option>
        <option value="name">名称</option><option value="reviewed">核验日期</option></select></div>
    ${rows.length?`<div style="overflow-x:auto"><table class="pv">
      <thead><tr><th>分级</th><th>厂商</th><th>类型</th><th>免费额度</th><th>有效期</th><th>门槛</th><th>核验</th></tr></thead>
      <tbody>${body}</tbody></table></div>`:`<div class="empty">没有匹配「${esc(pvQ)}」的厂商</div>`}</div>`;
  el("pvSortSel").value=pvSort;
  el("pvSortSel").onchange=e=>{pvSort=e.target.value;renderLibProviders()};
  const qi=el("pvQ");
  qi.oninput=e=>{pvQ=e.target.value;renderLibProviders();el("pvQ").focus();
    el("pvQ").setSelectionRange(pvQ.length,pvQ.length)};
  el("libProviders").querySelectorAll("[data-pv]").forEach(tr=>{
    tr.onclick=()=>openProvider(tr.dataset.pv);
  });
}

function openProvider(id){
  const p=D.providers.find(x=>x.id===id); if(!p) return;
  el("dwT").innerHTML=`<span class="rg ${p.region}" style="vertical-align:middle">${RL[p.region]}</span> ${esc(p.name)}`;
  el("dwS").textContent=`${p.id} · ${KL[p.kind]||p.kind}${p.pinned?" · S 级关注":""}`;
  const kv=[["分级",`${p.quality}（${QL[p.quality]}）— ${esc(p.quality_reason||"")}`],
    ["免费类型",FL[p.free_type]||p.free_type||"未标注"],["核验日期",p.reviewed||"—"]];
  if(p.openai_compat===1) kv.push(["OpenAI 兼容","是"]);
  if(p.commercial_ok===1) kv.push(["商用","允许"]);
  if(p.base_url) kv.push(["接口地址",`<code>${esc(p.base_url)}</code><button class="cp" data-copy="${esc(p.base_url)}">复制</button>`]);
  if(p.env_key) kv.push(["环境变量",`<code>${esc(p.env_key)}</code>`]);
  kv.push(["数据来源",(p.sources||[]).map(s=>s==="intel_quotas"?"free-llm-intel":s==="paco_providers"?"free-llm-api-hub":s==="manual_events"?"人工核实":s).join(" + ")]);
  const sec=[`<div class="sec"><div class="sec-h">关键事实</div><dl class="kv">
    ${kv.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl></div>`];
  if(p.free_quota) sec.push(`<div class="sec"><div class="sec-h">免费额度</div><p>${esc(p.free_quota)}</p></div>`);
  if(p.validity) sec.push(`<div class="sec"><div class="sec-h">有效期</div><p>${esc(p.validity)}</p></div>`);
  if((p.free_models||[]).length) sec.push(`<div class="sec"><div class="sec-h">免费模型</div>
    <ul>${p.free_models.map(m=>`<li>${esc(m)}</li>`).join("")}</ul></div>`);
  if((p.caveats||[]).length) sec.push(`<div class="sec"><div class="sec-h">注意事项</div>
    <ul>${p.caveats.map(m=>`<li>${esc(m)}</li>`).join("")}</ul></div>`);
  if(p.preconditions) sec.push(`<div class="sec"><div class="sec-h">前置条件</div><p>${esc(p.preconditions)}</p></div>`);
  if(p.rate_limits) sec.push(`<div class="sec"><div class="sec-h">限速</div><p>${esc(p.rate_limits)}</p></div>`);
  const links=(p.links||[]).slice();
  if(p.homepage&&!links.some(l=>l[1]===p.homepage)) links.push(["官网",p.homepage]);
  if(links.length) sec.push(`<div class="sec"><div class="sec-h">官方链接</div>
    ${links.map(([l,u])=>`<a class="lnk" href="${esc(u)}" target="_blank" rel="noopener">
      <span>${esc(l)}</span><span class="u">${esc(cut(u,42))}</span></a>`).join("")}</div>`);
  el("dwB").innerHTML=sec.join("");
  el("dwB").scrollTop=0;
  el("dwB").querySelectorAll("[data-copy]").forEach(b=>{
    b.onclick=e=>{e.stopPropagation();navigator.clipboard.writeText(b.dataset.copy).then(()=>toast("已复制")).catch(()=>toast("复制失败"))};
  });
  el("drawer").classList.add("on");el("scrim").classList.add("on");
}

function renderLibChanges(){
  const list=D.changes||[];
  el("lcChg").textContent=list.length;
  if(!list.length){
    el("libChanges").innerHTML=`<div class="panel"><div class="empty">
      暂无字段级变化记录${META.is_first_run?" · 首次运行已建立基线，明天起可看到 diff":""}</div></div>`;
    return;
  }
  const byDay={};
  list.forEach(c=>(byDay[c.date]=byDay[c.date]||[]).push(c));
  el("libChanges").innerHTML=Object.keys(byDay).sort().reverse().map(day=>{
    const items=byDay[day];
    return `<div class="chg-day"><div class="chg-hd"><span class="d">${day}</span>
      <span class="n">${items.length} 项</span></div>
      ${items.map(c=>{
        const kc=c.change_type==="new"?"k-new":c.change_type==="removed"?"k-removed":"k-field";
        const kt=c.change_type==="new"?"新增":c.change_type==="removed"?"移除":"字段";
        let b=`<div class="chg-t"><b>${esc(c.provider_name||c.provider_id)}</b>`;
        b+=c.change_type==="new"?" 新收录":c.change_type==="removed"?" 已从上游移除":` · ${esc(c.field)} 变化`;
        b+="</div>";
        if(c.change_type==="field") b+=`<div class="diff">
          <span class="d-old">${esc(cut(c.old_value||"（空）",96))}</span>
          <span class="d-arr">→</span>
          <span class="d-new">${esc(cut(c.new_value||"（空）",96))}</span></div>`;
        return `<div class="chg-i"><span class="chg-k ${kc}">${kt}</span>
          <div class="chg-b">${b}</div></div>`;
      }).join("")}</div>`;
  }).join("");
}

function switchScreen(name){
  document.querySelectorAll(".screen-btn").forEach(b=>b.classList.toggle("on",b.dataset.screen===name));
  el("screen-feed").classList.toggle("hidden",name!=="feed");
  el("screen-lib").classList.toggle("hidden",name!=="lib");
  window.scrollTo({top:0,behavior:"smooth"});
}
document.querySelectorAll(".screen-btn").forEach(b=>b.onclick=()=>switchScreen(b.dataset.screen));
document.querySelectorAll(".fchip[data-ck]").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".fchip[data-ck]").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");S.ck=b.dataset.ck;renderFeed();
  };
});
// 圈层：单选（全部 / 第一梯队 / 国内头部）
function bindTierGroup(){
  el("fTier1").classList.toggle("on", S.tier==="t1");
  document.querySelectorAll(".fchip[data-tier]").forEach(b=>
    b.classList.toggle("on", S.tier===b.dataset.tier));
}
el("fTier1").onclick=()=>{ S.tier = S.tier==="t1" ? "all" : "t1"; bindTierGroup(); renderFeed(); };
document.querySelectorAll(".fchip[data-tier]").forEach(b=>{
  b.onclick=()=>{ S.tier = S.tier===b.dataset.tier ? "all" : b.dataset.tier; bindTierGroup(); renderFeed(); };
});
// 模态：单选（全部 / 图像视频 / 图像 / 视频）
function bindModGroup(){
  el("fMulti").classList.toggle("on", S.mod==="multi");
  document.querySelectorAll(".fchip[data-mod]").forEach(b=>
    b.classList.toggle("on", S.mod===b.dataset.mod));
}
el("fMulti").onclick=()=>{ S.mod = S.mod==="multi" ? "all" : "multi"; bindModGroup(); renderFeed(); };
document.querySelectorAll(".fchip[data-mod]").forEach(b=>{
  b.onclick=()=>{ S.mod = S.mod===b.dataset.mod ? "all" : b.dataset.mod; bindModGroup(); renderFeed(); };
});
el("hideExpired").onchange=e=>{S.hideExpired=e.target.checked;renderFeed()};
el("onlyOfficial").onchange=e=>{S.onlyOfficial=e.target.checked;renderFeed()};

function switchLib(tab){
  document.querySelectorAll(".ltab").forEach(b=>b.classList.toggle("on",b.dataset.ltab===tab));
  ["sources","coverage","ranking","providers","changes"].forEach(t=>{
    el("lib"+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle("hidden",t!==tab);
  });
}
document.querySelectorAll(".ltab").forEach(b=>b.onclick=()=>switchLib(b.dataset.ltab));
el("dwX").onclick=closeDrawer;el("scrim").onclick=closeDrawer;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer()});
el("btnReload").onclick=()=>location.reload();

renderHead();renderChips();renderFeed();
renderLibSources();renderLibCoverage();renderLibRanking();renderLibProviders();renderLibChanges();
tick();
</script>
</body>
